[versions]
detekt = "2.0.0-alpha.6"
guava = "33.5.0-jre"
jacoco = "0.8.15"
junit-jupiter = "6.0.1"
kafka = "4.4.0"
konsist = "0.18.1"
kotlin = "2.4.10"
ktlint = "1.8.0"
ktlint-gradle = "14.2.0"
slf4j = "2.0.20"
testcontainers = "2.0.5"

[libraries]
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
